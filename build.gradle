plugins {
    id 'java'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
    id 'org.beryx.jlink' version '3.0.1'
}

java {
    application {
        version = '1.0-SNAPSHOT'
        group = 'com.vinberts'
        mainModule = "gifvault"
        mainClass = "com.vinberts.gifvault.MainApp"
        applicationDefaultJvmArgs = [
                '--add-exports', 'javafx.controls/com.sun.javafx.scene.control.behavior=com.jfoenix',
                '--add-exports', 'javafx.controls/com.sun.javafx.scene.control=com.jfoenix',
                '--add-exports', 'javafx.base/com.sun.javafx.binding=com.jfoenix',
                '--add-exports', 'javafx.graphics/com.sun.javafx.stage=com.jfoenix',
                '--add-exports', 'javafx.graphics/com.sun.javafx.scene=com.jfoenix',
                // Add this line to allow JFoenix to access skin internals
                '--add-opens', 'javafx.controls/com.sun.javafx.scene.control.skin=com.jfoenix',
                '--add-opens', 'javafx.controls/javafx.scene.control.skin=org.controlsfx.controls',
                '--add-exports', 'javafx.base/com.sun.javafx.event=com.jfoenix',
                // ControlsFX required exports
                // For various usages of TraversalEngine
                '--add-exports', 'javafx.graphics/com.sun.javafx.scene=org.controlsfx.controls',
                "--add-exports", "javafx.graphics/com.sun.javafx.scene.traversal=org.controlsfx.controls",
                // For various behaviors across controls
                "--add-exports", "javafx.controls/com.sun.javafx.scene.control.behavior=org.controlsfx.controls",
                // For ReadOnlyUnbackedObservableList across files
                "--add-exports", "javafx.controls/com.sun.javafx.scene.control=org.controlsfx.controls",
                // For InputMap used in behavior classes
                "--add-exports", "javafx.controls/com.sun.javafx.scene.control.inputmap=org.controlsfx.controls",
                // For EventHandlerManager in AutoCompletionBinding
                "--add-exports", "javafx.base/com.sun.javafx.event=org.controlsfx.controls",
                // For MappingChange, NonIterableChange across files
                "--add-exports", "javafx.base/com.sun.javafx.collections=org.controlsfx.controls",
                // For VersionInfo in VersionChecker
                "--add-exports", "javafx.base/com.sun.javafx.runtime=org.controlsfx.controls",
        ]
    }
    toolchain {
        languageVersion = JavaLanguageVersion.of(24)
    }
}




repositories {
    mavenCentral()
    maven {
        url 'https://jitpack.io'
    }
    flatDir {
        dirs 'libs'
    }
}



javafx {
    version = "21"
    modules = [ 'javafx.controls', 'javafx.fxml', 'javafx.media', 'javafx.web', 'javafx.swing' ]
}

dependencies {
    // Replace the old JFoenix dependency with this snapshot from GitHub
    implementation 'com.github.jfoenixadmin:JFoenix:master-SNAPSHOT'

    // https://mvnrepository.com/artifact/org.controlsfx/controlsfx
    implementation (group: 'org.controlsfx', name: 'controlsfx', version: '11.0.1') {
        exclude group: 'org.openjfx'
    }
    // VLC for JavaFx - use for displaying MP4s from Gif providers
    // https://mvnrepository.com/artifact/uk.co.caprica/vlcj-javafx
    implementation (group: 'uk.co.caprica', name: 'vlcj-javafx', version: '1.2.0')
    // https://mvnrepository.com/artifact/de.jensd/fontawesomefx
    implementation 'de.jensd:fontawesomefx-commons:9.1.2'
    implementation 'de.jensd:fontawesomefx-fontawesome:4.7.0-9.1.2'

    // requirements for hibernate to run
    // https://mvnrepository.com/artifact/net.bytebuddy/byte-buddy
    implementation group: 'net.bytebuddy', name: 'byte-buddy', version: '1.10.10'
    // https://mvnrepository.com/artifact/javax.xml.bind/jaxb-api
    implementation group: 'javax.xml.bind', name: 'jaxb-api', version: '2.3.1'
    // https://mvnrepository.com/artifact/com.fasterxml/classmate
    implementation group: 'com.fasterxml', name: 'classmate', version: '1.5.1'
    /// end required libs for hibernate

    implementation group: 'org.hibernate', name: 'hibernate-core', version: '5.4.15.Final'
    // https://mvnrepository.com/artifact/com.google.code.gson/gson
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation group: 'commons-io', name: 'commons-io', version: '2.14.0'
    implementation (name:'giphy4j', version: '1.2.2-SNAPSHOT', ext:'jar')
    implementation (name:'h2', version: '1.4.200', ext:'jar')
    // SLF4J as a facade over Log4j2 required dependencies
    implementation group: 'org.apache.logging.log4j', name: 'log4j-api', version: '2.11.0'
    implementation group: 'org.apache.logging.log4j', name: 'log4j-core', version: '2.11.0'
    implementation group: 'org.apache.logging.log4j', name: 'log4j-slf4j-impl', version: '2.11.0'

    // Bridges from other logging implementations to SLF4J. Be careful not to bridge SLF4J to log4j2 in the other direction by mistake.
    implementation group: 'org.slf4j', name: 'jul-to-slf4j', version: '1.7.25' // JUL bridge
    implementation group: 'org.slf4j', name: 'jcl-over-slf4j', version: '1.7.25' // Apache Commons Logging (JCL) bridge
    implementation group: 'org.slf4j', name: 'log4j-over-slf4j', version: '1.7.25' // log4j1.2 bridge

}

jlink {
    options = ['--strip-debug', '--compress', '2', '--no-header-files', '--no-man-pages']
    launcher {
        name = 'gifvault'
    }
}
